<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="card">
        <form>
            <h1 id="login">sign in</h1>
            <input type="email" placeholder="email">
            <input type="password" placeholder="password">
            <a href="https://example.com" class="forgotpass" target="_blank">forgot password?</a>
            <button id="loginbtn" type="submit">sign in</button>
            <a href="https://example.com" class="register" target="_blank">forgot password?</a>
            
        </form>
    </div>
</body>
</html>
