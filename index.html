<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/png" href="./icons/logo.png">
</head>
<body>
    <nav class="colorchange">
        <button id="color-one">one</button>
        <button id="color-two">two</button>
        <button id="color-three">three</button>
        <button id="color-four">four</button>
    </nav>
    
    <div class="wrapper">
        <h1>L O C K - I N</h1>
        <form>
            <input id="inputTodo" type="text" placeholder="Add your work" autocomplete="off" />
            <button id="addTodo" type="submit">Add Todo</button>
        </form>
        <ul id="todo-list"></ul>
          
    </div>

</body>
</html>
