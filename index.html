<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" type="image/png" href="./icons/logo.png">
</head>
<body>
    <nav class="colorchange">
        <span id="choosecolor"> choose your desirable color</span>
        <span>
            <input type="text" id="hexcode" value="#" maxlength="7" autocomplete="off" placeholder="enter your hexcode"/>
        </span>
        <span>
            <button id="defaultColor">Default Colour</button>
        </span>
        
        <button id="signin">sign in</button>
    </nav>
    <div class="wrapper">
        <h1>L O C K - I N</h1>
        <form>
            <input id="inputTodo" type="text" placeholder="Add your work" autocomplete="off" />
            <button id="addTodo" type="submit">Add Todo</button>
        </form>
        <ul id="todo-list"></ul>
          
    </div>

</body>
</html>
